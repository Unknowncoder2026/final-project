{% extends 'base.html' %}
{% block title %}Edit Patient{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-md-10">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-header bg-success text-white py-3">
        <h3 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Patient</h3>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="patient-form">{{ form.as_p }}</div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-circle"></i> Update Patient</button>
            <a href="{% url 'patients' %}" class="btn btn-secondary px-4"><i class="bi bi-arrow-left"></i> Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
