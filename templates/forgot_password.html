{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | City Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body{min-height:100vh;margin:0;background:linear-gradient(135deg,#0d6efd,#084298);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:20px}
        .box{width:100%;max-width:460px;background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 55px rgba(0,0,0,.25)}
        .icon{width:70px;height:70px;border-radius:18px;background:#eaf2ff;color:#0d6efd;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
        h2{font-weight:800;color:#0d47a1;text-align:center;margin-bottom:8px}.sub{text-align:center;color:#64748b;margin-bottom:24px}
        .form-control{min-height:48px;border-radius:11px}.btn{min-height:48px;border-radius:11px;font-weight:700}
        .back{text-align:center;margin-top:20px}.back a{text-decoration:none}
    </style>
</head>
<body>
<div class="box">
    <div class="icon"><i class="bi bi-shield-lock"></i></div>
    <h2>Forgot Password?</h2>
    <p class="sub">Enter your username, email or registered mobile number and choose a new password.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3"><label class="form-label fw-semibold">Username / Email / Mobile</label><input class="form-control" name="identifier" required autocomplete="username" value="{{ request.POST.identifier|default:'' }}"></div>
        <div class="mb-3"><label class="form-label fw-semibold">New Password</label><input class="form-control" type="password" name="password1" minlength="8" required autocomplete="new-password"></div>
        <div class="mb-4"><label class="form-label fw-semibold">Confirm New Password</label><input class="form-control" type="password" name="password2" minlength="8" required autocomplete="new-password"></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-key me-2"></i>Change Password</button>
    </form>
    <div class="back"><a href="{% url 'login' %}"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></div>
</div>
</body>
</html>
