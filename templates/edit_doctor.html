{% extends 'base.html' %}
{% block title %}Edit Doctor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-md-9">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-header bg-primary text-white py-3">
        <h3 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Doctor</h3>
      </div>
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="doctor-form">{{ form.as_p }}</div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle"></i> Update Doctor</button>
            <a href="{% url 'doctors' %}" class="btn btn-secondary px-4"><i class="bi bi-arrow-left"></i> Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
